<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ERA Koleji | Zaman Yönetimi</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --arka-plan: #F5F0E6;
    --yazi: #000000;
    --kart: rgba(255,255,255,0.55);
}

body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background: var(--arka-plan);
    color: var(--yazi);

    font-family: Arial, Helvetica, sans-serif;

    transition: background 0.3s, color 0.3s;
}

button {
    font-family: inherit;
}

/* =================================================
   LOGO
================================================= */

.logo {
    width: 150px;
    max-width: 20vw;
    height: auto;

    object-fit: contain;

    user-select: none;
    pointer-events: none;
}


/* =================================================
   ANA MENÜ
================================================= */

#anaMenu {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    gap: 45px;
}

.menu-baslik {
    font-size: clamp(28px, 4vw, 55px);

    font-weight: 700;

    letter-spacing: 2px;
}

.menu-secenekler {
    display: flex;

    gap: 25px;

    width: 90%;
    max-width: 1100px;
}

.menu-kart {
    flex: 1;

    min-height: 230px;

    border: 2px solid rgba(0,0,0,0.15);

    border-radius: 25px;

    background: var(--kart);

    color: var(--yazi);

    cursor: pointer;

    display: flex;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    gap: 15px;

    transition: 0.25s;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.08);
}

.menu-kart:hover {

    transform: translateY(-8px);

    box-shadow:
        0 18px 40px rgba(0,0,0,0.15);
}

.menu-ikon {
    font-size: 65px;
}

.menu-kart h2 {
    font-size: 28px;
}

.menu-kart p {
    font-size: 15px;

    opacity: 0.65;
}


/* =================================================
   GENEL MOD
================================================= */

.mod {
    width: 100%;
    height: 100vh;

    display: none;

    position: relative;
}

.mod.aktif {
    display: flex;
}


/* =================================================
   SAAT
================================================= */

#saatModu {

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 35px;
}

#saat {

    font-size: clamp(80px, 18vw, 300px);

    font-weight: 700;

    line-height: 0.9;

    letter-spacing: 0.02em;

    white-space: nowrap;

    user-select: none;
}


/* =================================================
   SINAV AYARLARI
================================================= */

#sinavAyarlari {

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 25px;
}

.ayar-baslik {

    font-size: clamp(30px, 4vw, 55px);
}

.sinav-form {

    width: min(600px, 90%);

    background: rgba(255,255,255,0.6);

    border-radius: 20px;

    padding: 30px;

    display: flex;

    flex-direction: column;

    gap: 20px;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.08);
}

.form-satir {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    font-size: 20px;
}

.form-satir input {

    padding: 12px 15px;

    font-size: 20px;

    border-radius: 10px;

    border: 1px solid #bbb;

    background: white;
}

.baslat-btn {

    margin-top: 10px;

    padding: 16px 25px;

    border: none;

    border-radius: 12px;

    background: #000;

    color: white;

    font-size: 20px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;
}

.baslat-btn:hover {

    transform: scale(1.02);
}


/* =================================================
   SINAV EKRANI
================================================= */

#sinavEkrani {

    flex-direction: column;

    justify-content: center;

    align-items: center;

    position: relative;
}


/* BÜYÜTÜLMÜŞ SINAV BİLGİLERİ */

.sinav-bilgi {

    position: absolute;

    top: 35px;

    left: 5%;

    width: 90%;

    display: flex;

    justify-content: space-between;
}

.sinav-bilgi-kutu {

    text-align: center;

    min-width: 300px;
}

.sinav-bilgi-kutu .etiket {

    font-size: clamp(32px, 3vw, 48px);

    font-weight: 700;

    margin-bottom: 8px;
}

.sinav-bilgi-kutu .deger {

    font-size: clamp(40px, 4vw, 60px);

    font-weight: 700;
}


/* SINAV MERKEZ */

.sinav-merkez {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 35px;
}

#sinavSaati {

    font-size: clamp(80px, 18vw, 300px);

    font-weight: 700;

    line-height: 0.9;

    letter-spacing: 0.02em;

    white-space: nowrap;

    user-select: none;
    
}

.sinav-kalan {

    position: absolute;

    bottom: 35px;

    font-size: 25px;

    font-weight: bold;

    opacity: 0.75;
}


/* =================================================
   SINAV DURUM
================================================= */

#sinavDurum {

    position: absolute;

    bottom: 75px;

    font-size: 30px;

    font-weight: bold;
}


/* =================================================
   GERİ SAYIM AYAR
================================================= */

#sayacAyarlari {

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 25px;
}

.sayac-form {

    display: flex;

    gap: 15px;

    align-items: center;

    justify-content: center;
}

.sayac-input {

    width: 130px;

    padding: 15px;

    text-align: center;

    font-size: 28px;

    border-radius: 12px;

    border: 1px solid #aaa;
}

.sayac-ayrac {

    font-size: 35px;

    font-weight: bold;
}


/* =================================================
   GERİ SAYIM
================================================= */

#sayacModu {

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 35px;
}

#sayac {

    font-size: clamp(80px, 18vw, 300px);

    font-weight: 700;

    line-height: 0.9;

    white-space: nowrap;
}

.sayac-kontrol {

    display: flex;

    gap: 12px;
}

.kontrol-btn {

    padding: 13px 25px;

    border: none;

    border-radius: 10px;

    background: #000;

    color: white;

    font-size: 18px;

    cursor: pointer;

    transition: 0.2s;
}

.kontrol-btn:hover {

    opacity: 0.8;

    transform: scale(1.03);
}

#sayacDurum {

    font-size: 22px;

    font-weight: bold;
}


/* =================================================
   LOGO ALT
================================================= */

.alt-logo {

    position: absolute;

    bottom: 35px;

    left: 50%;

    transform: translateX(-50%);

    width: 120px;
}


/* =================================================
   GERİ BUTONU
================================================= */

.geri-btn {

    position: fixed;

    top: 20px;
    left: 20px;

    z-index: 100;

    border: none;

    width: 48px;
    height: 48px;

    border-radius: 50%;

    background: rgba(0,0,0,0.12);

    color: var(--yazi);

    font-size: 25px;

    cursor: pointer;
}

.geri-btn:hover {

    background: rgba(0,0,0,0.25);
}


/* =================================================
   AYAR BUTONU
================================================= */

#ayarButonu {

    position: fixed;

    top: 20px;
    right: 20px;

    z-index: 200;

    width: 48px;
    height: 48px;

    border: none;

    border-radius: 50%;

    background: rgba(0,0,0,0.12);

    color: var(--yazi);

    font-size: 22px;

    cursor: pointer;
}


/* =================================================
   AYAR PANELİ
================================================= */

#ayarlar {

    position: fixed;

    top: 80px;
    right: 20px;

    z-index: 201;

    width: 290px;

    padding: 20px;

    background: rgba(30,30,30,0.95);

    color: white;

    border-radius: 15px;

    display: none;

    flex-direction: column;

    gap: 17px;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.35);
}

.ayar-satir {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;
}

.ayar-satir input[type="color"] {

    width: 55px;

    height: 35px;

    border: none;

    cursor: pointer;
}

.ayar-satir select {

    padding: 8px;

    border-radius: 7px;
}


/* =================================================
   TAM EKRAN
================================================= */

#tamEkran {

    position: fixed;

    right: 20px;
    bottom: 20px;

    width: 55px;
    height: 55px;

    border: none;

    border-radius: 50%;

    background: rgba(0,0,0,0.12);

    color: var(--yazi);

    font-size: 26px;

    cursor: pointer;

    opacity: 0.45;

    z-index: 200;

    transition: 0.25s;
}

#tamEkran:hover {

    opacity: 1;

    transform: scale(1.08);
}


/* =================================================
   UYARI EKRANI
================================================= */

#uyariEkrani {

    position: fixed;

    inset: 0;

    z-index: 1000;

    background: rgba(245,240,230,0.96);

    display: none;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    gap: 25px;

    animation: uyariGiris 0.5s ease;
}

#uyariEkrani.aktif {

    display: flex;
}

.uyari-ikon {

    font-size: 100px;

    animation: uyariTitre 0.8s infinite;
}

#uyariBaslik {

    font-size: clamp(45px, 7vw, 100px);

    font-weight: 800;

    letter-spacing: 2px;
}

#uyariAlt {

    font-size: clamp(20px, 3vw, 35px);

    font-weight: 600;

    opacity: 0.75;
}

.uyari-kapat {

    margin-top: 15px;

    padding: 15px 35px;

    border: none;

    border-radius: 12px;

    background: #000;

    color: white;

    font-size: 20px;

    cursor: pointer;
}

@keyframes uyariGiris {

    from {
        opacity: 0;
        transform: scale(1.05);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes uyariTitre {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.15);
    }
}


/* =================================================
   MOBİL
================================================= */

@media (max-width: 700px) {

    .menu-secenekler {

        flex-direction: column;

        gap: 15px;
    }

    .menu-kart {

        min-height: 150px;
    }

    .menu-ikon {

        font-size: 40px;
    }

    .menu-kart h2 {

        font-size: 22px;
    }

    .sinav-bilgi {

        top: 75px;
    }

    .sinav-bilgi-kutu {

        min-width: 0;
    }

    .sinav-bilgi-kutu .etiket {

        font-size: 20px;
    }

    .sinav-bilgi-kutu .deger {

        font-size: 28px;
    }

    .sayac-form {

        gap: 7px;
    }

    .sayac-input {

        width: 90px;

        font-size: 22px;
    }

}

</style>
</head>


<body>


<!-- =================================================
     ANA MENÜ
================================================= -->

<section id="anaMenu">

    <div class="menu-baslik">
        ERA ZAMAN YÖNETİMİ
    </div>


    <div class="menu-secenekler">


        <button
            class="menu-kart"
            onclick="saatModunuAc()">

            <div class="menu-ikon">
                🕐
            </div>

            <h2>
                SAAT
            </h2>

            <p>
                Standart saat ekranı
            </p>

        </button>


        <button
            class="menu-kart"
            onclick="sinavAyarlariniAc()">

            <div class="menu-ikon">
                📝
            </div>

            <h2>
                SINAV SAATİ
            </h2>

            <p>
                Sınav başlangıç ve bitiş saati
            </p>

        </button>


        <button
            class="menu-kart"
            onclick="sayacAyarlariniAc()">

            <div class="menu-ikon">
                ⏱️
            </div>

            <h2>
                GERİ SAYIM SAYACI
            </h2>

            <p>
                Belirlediğiniz süreyi geri sayın
            </p>

        </button>


    </div>

</section>



<!-- =================================================
     SAAT
================================================= -->

<section
    id="saatModu"
    class="mod">

    <button
        class="geri-btn"
        onclick="anaMenuyeDon()">

        ←

    </button>


    <div id="saat">
        00:00:00
    </div>


    <img
        class="logo"
        src="https://i.ibb.co/S4shgSBx/1000132242.png"
        alt="ERA Koleji">

</section>



<!-- =================================================
     SINAV AYARLARI
================================================= -->

<section
    id="sinavAyarlari"
    class="mod">

    <button
        class="geri-btn"
        onclick="anaMenuyeDon()">

        ←

    </button>


    <h1 class="ayar-baslik">
        SINAV SAATİ
    </h1>


    <div class="sinav-form">


        <div class="form-satir">

            <label>
                Sınav Başlangıcı
            </label>

            <input
                type="time"
                id="sinavBaslangic"
                value="10:00">

        </div>


        <div class="form-satir">

            <label>
                Sınav Bitişi
            </label>

            <input
                type="time"
                id="sinavBitis"
                value="11:00">

        </div>


        <button
            class="baslat-btn"
            onclick="sinaviBaslat()">

            SINAVI BAŞLAT

        </button>


    </div>

</section>



<!-- =================================================
     SINAV EKRANI
================================================= -->

<section
    id="sinavEkrani"
    class="mod">


    <button
        class="geri-btn"
        onclick="anaMenuyeDon()">

        ←

    </button>


    <div class="sinav-bilgi">


        <div class="sinav-bilgi-kutu">

            <div class="etiket">
                Sınav Başlangıcı
            </div>

            <div
                class="deger"
                id="gosterBaslangic">

                10:00

            </div>

        </div>


        <div class="sinav-bilgi-kutu">

            <div class="etiket">
                Sınav Bitişi
            </div>

            <div
                class="deger"
                id="gosterBitis">

                11:00

            </div>

        </div>


    </div>


    <div class="sinav-merkez">

        <div id="sinavSaati">
            00:00:00
        </div>


        <img
            class="logo"
            src="https://i.ibb.co/S4shgSBx/1000132242.png"
            alt="ERA Koleji">

    </div>


    <div
        class="sinav-kalan"
        id="sinavKalan">

        Sınav süresi hesaplanıyor...

    </div>


    <div id="sinavDurum"></div>


</section>



<!-- =================================================
     GERİ SAYIM AYARLARI
================================================= -->

<section
    id="sayacAyarlari"
    class="mod">


    <button
        class="geri-btn"
        onclick="anaMenuyeDon()">

        ←

    </button>


    <h1 class="ayar-baslik">
        GERİ SAYIM SAYACI
    </h1>


    <div class="sayac-form">


        <input
            class="sayac-input"
            id="sayacSaat"
            type="number"
            min="0"
            max="99"
            value="0">


        <div class="sayac-ayrac">
            :
        </div>


        <input
            class="sayac-input"
            id="sayacDakika"
            type="number"
            min="0"
            max="59"
            value="10">


        <div class="sayac-ayrac">
            :
        </div>


        <input
            class="sayac-input"
            id="sayacSaniye"
            type="number"
            min="0"
            max="59"
            value="0">


    </div>


    <button
        class="baslat-btn"
        onclick="sayaciBaslat()">

        BAŞLAT

    </button>


</section>



<!-- =================================================
     GERİ SAYIM
================================================= -->

<section
    id="sayacModu"
    class="mod">


    <button
        class="geri-btn"
        onclick="anaMenuyeDon()">

        ←

    </button>


    <div id="sayac">
        00:10:00
    </div>


    <div class="sayac-kontrol">


        <!-- TEK BAŞLAT / DURDUR BUTONU -->

        <button
            class="kontrol-btn"
            id="sayacBaslatDurdur"
            onclick="sayacBaslatDurdur()">

            ▶ Başlat

        </button>


        <button
            class="kontrol-btn"
            onclick="sayaciSifirla()">

            ↻ Sıfırla

        </button>


    </div>


    <div id="sayacDurum">
        Hazır
    </div>


    <img
        class="logo alt-logo"
        src="https://i.ibb.co/S4shgSBx/1000132242.png"
        alt="ERA Koleji">


</section>



<!-- =================================================
     AYARLAR
================================================= -->

<button
    id="ayarButonu"
    title="Ayarlar">

    ⚙️

</button>


<div id="ayarlar">


    <div class="ayar-satir">

        <label>
            Arka Plan
        </label>

        <input
            type="color"
            id="arkaPlan"
            value="#F5F0E6">

    </div>


    <div class="ayar-satir">

        <label>
            Yazı Rengi
        </label>

        <input
            type="color"
            id="yaziRengi"
            value="#000000">

    </div>


    <div class="ayar-satir">

        <label>
            Yazı Tipi
        </label>


        <select id="fontSec">

            <option value="Arial, sans-serif">
                Arial
            </option>

            <option value="Verdana, sans-serif">
                Verdana
            </option>

            <option value="Tahoma, sans-serif">
                Tahoma
            </option>

            <option value="'Trebuchet MS', sans-serif">
                Trebuchet MS
            </option>

            <option value="'Courier New', monospace">
                Courier New
            </option>

            <option value="Impact, sans-serif">
                Impact
            </option>

            <option value="Georgia, serif">
                Georgia
            </option>

        </select>

    </div>

</div>



<!-- =================================================
     TAM EKRAN
================================================= -->

<button
    id="tamEkran"
    title="Tam Ekran">

    ⛶

</button>



<!-- =================================================
     UYARI EKRANI
================================================= -->

<div id="uyariEkrani">


    <div class="uyari-ikon">
        🔔
    </div>


    <div id="uyariBaslik">
        SÜRE DOLDU
    </div>


    <div id="uyariAlt">
        İşlem tamamlandı.
    </div>


    <button
        class="uyari-kapat"
        onclick="uyariyiKapat()">

        TAMAM

    </button>


</div>



<script>

/* =================================================
   GENEL
================================================= */

function tumModlariGizle() {

    document
        .querySelectorAll(".mod")
        .forEach(mod => {

            mod.classList.remove("aktif");

        });

    document
        .getElementById("anaMenu")
        .style.display = "none";
}


function anaMenuyeDon() {

    clearInterval(sinavInterval);

    clearInterval(sayacInterval);

    sayacCalisiyor = false;

    document
        .querySelectorAll(".mod")
        .forEach(mod => {

            mod.classList.remove("aktif");

        });

    document
        .getElementById("anaMenu")
        .style.display = "flex";
}


/* =================================================
   SAAT
================================================= */

function saatiGuncelle() {

    const simdi = new Date();

    const saat =
        String(simdi.getHours())
        .padStart(2, "0");

    const dakika =
        String(simdi.getMinutes())
        .padStart(2, "0");

    const saniye =
        String(simdi.getSeconds())
        .padStart(2, "0");

    const zaman =
        `${saat}:${dakika}:${saniye}`;


    document
        .getElementById("saat")
        .textContent = zaman;


    document
        .getElementById("sinavSaati")
        .textContent = zaman;
}

saatiGuncelle();

setInterval(
    saatiGuncelle,
    1000
);


/* =================================================
   SAAT MODU
================================================= */

function saatModunuAc() {

    tumModlariGizle();

    document
        .getElementById("saatModu")
        .classList.add("aktif");
}


/* =================================================
   SINAV AYARLARI
================================================= */

function sinavAyarlariniAc() {

    tumModlariGizle();

    document
        .getElementById("sinavAyarlari")
        .classList.add("aktif");
}


/* =================================================
   SINAV
================================================= */

let sinavInterval = null;


function sinaviBaslat() {

    const baslangic =
        document
        .getElementById("sinavBaslangic")
        .value;


    const bitis =
        document
        .getElementById("sinavBitis")
        .value;


    if (!baslangic || !bitis) {

        alert(
            "Lütfen başlangıç ve bitiş saatlerini seçin."
        );

        return;
    }


    const [basSaat, basDakika] =
        baslangic.split(":").map(Number);


    const [bitSaat, bitDakika] =
        bitis.split(":").map(Number);


    const simdi = new Date();


    const basZaman = new Date(simdi);

    basZaman.setHours(
        basSaat,
        basDakika,
        0,
        0
    );


    const bitZaman = new Date(simdi);

    bitZaman.setHours(
        bitSaat,
        bitDakika,
        0,
        0
    );


    if (bitZaman <= basZaman) {

        alert(
            "Bitiş saati başlangıç saatinden sonra olmalıdır."
        );

        return;
    }


    document
        .getElementById("gosterBaslangic")
        .textContent = baslangic;


    document
        .getElementById("gosterBitis")
        .textContent = bitis;


    tumModlariGizle();


    document
        .getElementById("sinavEkrani")
        .classList.add("aktif");


    clearInterval(sinavInterval);


    sinavKontrol();


    sinavInterval =
        setInterval(
            sinavKontrol,
            1000
        );
}


/* =================================================
   SINAV KONTROL
================================================= */

function sinavKontrol() {

    const simdi = new Date();


    const baslangic =
        document
        .getElementById("sinavBaslangic")
        .value;


    const bitis =
        document
        .getElementById("sinavBitis")
        .value;


    const [basSaat, basDakika] =
        baslangic.split(":").map(Number);


    const [bitSaat, bitDakika] =
        bitis.split(":").map(Number);


    const basZaman = new Date();

    basZaman.setHours(
        basSaat,
        basDakika,
        0,
        0
    );


    const bitZaman = new Date();

    bitZaman.setHours(
        bitSaat,
        bitDakika,
        0,
        0
    );


    const kalan =
        bitZaman - simdi;


    const sinavKalan =
        document.getElementById(
            "sinavKalan"
        );


    const sinavDurum =
        document.getElementById(
            "sinavDurum"
        );


    /* BİTTİ */

    if (kalan <= 0) {

        sinavKalan.textContent =
            "Sınav süresi doldu.";

        sinavDurum.textContent =
            "SINAV SÜRESİ DOLDU";


        clearInterval(
            sinavInterval
        );


        uyariGoster(
            "SINAV SÜRESİ DOLDU",
            "Sınav tamamlandı."
        );


        return;
    }


    /* HENÜZ BAŞLAMADI */

    if (simdi < basZaman) {

        const bekleme =
            basZaman - simdi;


        sinavKalan.textContent =
            "Sınavın başlamasına: " +
            sureFormatla(bekleme);


        sinavDurum.textContent =
            "SINAV BAŞLAMADI";


        return;
    }


    /* DEVAM EDİYOR */

    sinavDurum.textContent =
        "SINAV DEVAM EDİYOR";


    sinavKalan.textContent =
        "Kalan Süre: " +
        sureFormatla(kalan);
}


/* =================================================
   SÜRE FORMAT
================================================= */

function sureFormatla(ms) {

    let toplam =
        Math.floor(ms / 1000);


    let saat =
        Math.floor(
            toplam / 3600
        );


    toplam %= 3600;


    let dakika =
        Math.floor(
            toplam / 60
        );


    let saniye =
        toplam % 60;


    return (
        String(saat).padStart(2,"0") +
        ":" +
        String(dakika).padStart(2,"0") +
        ":" +
        String(saniye).padStart(2,"0")
    );
}


/* =================================================
   SAYAC AYARLARI
================================================= */

function sayacAyarlariniAc() {

    tumModlariGizle();

    document
        .getElementById("sayacAyarlari")
        .classList.add("aktif");
}


/* =================================================
   SAYAC DEĞİŞKENLERİ
================================================= */

let sayacInterval = null;

let sayacToplamSaniye = 0;

let sayacCalisiyor = false;


/* =================================================
   SAYACI AYARLA
================================================= */

function sayaciBaslat() {

    const saat =
        parseInt(
            document
            .getElementById("sayacSaat")
            .value
        ) || 0;


    const dakika =
        parseInt(
            document
            .getElementById("sayacDakika")
            .value
        ) || 0;


    const saniye =
        parseInt(
            document
            .getElementById("sayacSaniye")
            .value
        ) || 0;


    sayacToplamSaniye =
        (saat * 3600) +
        (dakika * 60) +
        saniye;


    if (sayacToplamSaniye <= 0) {

        alert(
            "Lütfen 0'dan büyük bir süre girin."
        );

        return;
    }


    clearInterval(
        sayacInterval
    );


    sayacCalisiyor = false;


    tumModlariGizle();


    document
        .getElementById("sayacModu")
        .classList.add("aktif");


    sayaciGoster();


    document
        .getElementById("sayacBaslatDurdur")
        .textContent =
        "▶ Başlat";


    document
        .getElementById("sayacDurum")
        .textContent =
        "Hazır";
}


/* =================================================
   TEK BAŞLAT / DURDUR BUTONU
================================================= */

function sayacBaslatDurdur() {

    if (sayacCalisiyor) {

        /* DURDUR */

        clearInterval(
            sayacInterval
        );


        sayacCalisiyor = false;


        document
            .getElementById(
                "sayacBaslatDurdur"
            )
            .textContent =
            "▶ Başlat";


        document
            .getElementById(
                "sayacDurum"
            )
            .textContent =
            "Durduruldu";


        return;
    }


    /* BAŞLAT */

    if (sayacToplamSaniye <= 0) {

        return;
    }


    sayacCalisiyor = true;


    document
        .getElementById(
            "sayacBaslatDurdur"
        )
        .textContent =
        "⏸ Durdur";


    document
        .getElementById(
            "sayacDurum"
        )
        .textContent =
        "Çalışıyor";


    sayacInterval =
        setInterval(
            function () {

                if (
                    sayacToplamSaniye <= 0
                ) {

                    clearInterval(
                        sayacInterval
                    );


                    sayacCalisiyor = false;


                    document
                        .getElementById(
                            "sayacBaslatDurdur"
                        )
                        .textContent =
                        "▶ Başlat";


                    document
                        .getElementById(
                            "sayac"
                        )
                        .textContent =
                        "00:00:00";


                    document
                        .getElementById(
                            "sayacDurum"
                        )
                        .textContent =
                        "SÜRE DOLDU";


                    /* UYARI */

                    uyariGoster(
                        "SÜRE DOLDU",
                        "Geri sayım tamamlandı."
                    );


                    return;
                }


                sayacToplamSaniye--;

                sayaciGoster();

            },
            1000
        );
}


/* =================================================
   SAYACI GÖSTER
================================================= */

function sayaciGoster() {

    let saat =
        Math.floor(
            sayacToplamSaniye / 3600
        );


    let dakika =
        Math.floor(
            (sayacToplamSaniye % 3600) / 60
        );


    let saniye =
        sayacToplamSaniye % 60;


    document
        .getElementById("sayac")
        .textContent =

        String(saat).padStart(2,"0") +
        ":" +
        String(dakika).padStart(2,"0") +
        ":" +
        String(saniye).padStart(2,"0");
}


/* =================================================
   SAYACI SIFIRLA
================================================= */

function sayaciSifirla() {

    clearInterval(
        sayacInterval
    );


    sayacCalisiyor = false;

    sayacToplamSaniye = 0;


    document
        .getElementById("sayac")
        .textContent =
        "00:00:00";


    document
        .getElementById(
            "sayacBaslatDurdur"
        )
        .textContent =
        "▶ Başlat";


    document
        .getElementById(
            "sayacDurum"
        )
        .textContent =
        "Sıfırlandı";
}


/* =================================================
   UYARI
================================================= */

let alarmContext = null;


function uyariGoster(baslik, alt) {

    document
        .getElementById("uyariBaslik")
        .textContent = baslik;


    document
        .getElementById("uyariAlt")
        .textContent = alt;


    document
        .getElementById("uyariEkrani")
        .classList.add("aktif");


    alarmSesiCal();
}


/* =================================================
   UYARIYI KAPAT
================================================= */

function uyariyiKapat() {

    document
        .getElementById("uyariEkrani")
        .classList.remove("aktif");


    if (alarmContext) {

        alarmContext.close();

        alarmContext = null;
    }
}


/* =================================================
   UYARI SESİ
================================================= */

function alarmSesiCal() {

    try {

        alarmContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        const ctx =
            alarmContext;


        const oscillator =
            ctx.createOscillator();


        const gain =
            ctx.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.value =
            880;


        gain.gain.setValueAtTime(
            0.0001,
            ctx.currentTime
        );


        oscillator.connect(gain);

        gain.connect(ctx.destination);


        oscillator.start();


        /*
           3 kez bip sesi
        */

        for (
            let i = 0;
            i < 3;
            i++
        ) {

            const basla =
                ctx.currentTime +
                i * 0.55;


            gain.gain.setValueAtTime(
                0.0001,
                basla
            );


            gain.gain.exponentialRampToValueAtTime(
                0.35,
                basla + 0.03
            );


            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                basla + 0.35
            );

        }


        oscillator.stop(
            ctx.currentTime + 2
        );

    }

    catch (e) {

        console.log(
            "Ses oluşturulamadı.",
            e
        );

    }
}

/* =================================================
   TAM EKRAN
================================================= */

document
    .getElementById("tamEkran")
    .addEventListener(
        "click",
        async function () {

            try {

                if (
                    !document.fullscreenElement
                ) {

                    await document
                        .documentElement
                        .requestFullscreen();

                }

                else {

                    await document
                        .exitFullscreen();

                }

            }

            catch (hata) {

                console.log(hata);

            }

        }
    );


/* =================================================
   F TUŞU
================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key.toLowerCase() === "f" &&
            event.target.tagName !== "INPUT" &&
            event.target.tagName !== "SELECT"
        ) {

            document
                .getElementById(
                    "tamEkran"
                )
                .click();

        }

    }
);
